name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64, os: ubuntu-latest }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
          - { name: macOS Apple Silicon, os: macos-latest }
          # macos-13 is retired; keep this job on an explicitly Intel runner.
          - { name: macOS Intel, os: macos-15-intel }
          - { name: Windows x86-64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages (ALSA, X11/Wayland, GTK for file dialogs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      # CI runners have no sound card: the audio tests use the offline renderer and the silent
      # clock; the UI tests render without a window. The offscreen-screenshot example (wgpu) is
      # only built, not run, because hosted runners may lack a GPU adapter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # LimeShot's instruments and effects are the Lime VST3s (D39); the equivalence test in
      # limeshot-ui/tests/lime_vst3.rs loads these bundles and fails on CI without them.
      - name: Build the Lime VST3 bundles
        working-directory: native-plugins
        run: python build.py --debug
      - name: Test
        env:
          LIMESHOT_LIME_PLUGINS: ${{ github.workspace }}/native-plugins/target/debug-bundled
        run: cargo test --workspace
      - name: Headless demo render
        shell: bash
        run: |
          mkdir -p out
          cargo run -q -p limeshot-app --bin limeshot-cli -- demo out/demo.lime --render out/demo.wav
          cargo run -q -p limeshot-app --bin limeshot-cli -- render out/demo.lime out/demo2.wav
          cmp out/demo.wav out/demo2.wav
      - name: Validate feature inventory
        shell: bash
        run: |
          python3 scripts/features.py check
          python3 scripts/check_repository.py

  windows-arm64:
    name: Windows ARM64 (cross-compile check)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target aarch64-pc-windows-msvc
