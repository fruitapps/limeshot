name: Lime Native VST3

on:
  push:
    branches: [main]
    paths: ["native-plugins/**", "crates/limeshot-core/**", "crates/limeshot-dsp/**", "crates/limeshot-engine/**", "crates/limeshot-sequencer/**", "crates/limeshot-project/**", ".github/workflows/native-plugins.yml"]
  pull_request:
    paths: ["native-plugins/**", "crates/limeshot-core/**", "crates/limeshot-dsp/**", "crates/limeshot-engine/**", "crates/limeshot-sequencer/**", "crates/limeshot-project/**", ".github/workflows/native-plugins.yml"]
  workflow_dispatch:

jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-plugins
      - name: Linux native editor dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python build.py
      - name: Load exported bundles and verify audio/state/automation through the VST3 ABI
        run: cargo run -p lime-native --example verify -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: Lime-Native-VST3-${{ matrix.os }}
          path: native-plugins/dist/
