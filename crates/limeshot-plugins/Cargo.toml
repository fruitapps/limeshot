[package]
name = "limeshot-plugins"
description = "LimeShot plugin hosting (VST3): scanning, loading and processing. The only crate allowed `unsafe`"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
limeshot-dsp.workspace = true
thiserror.workspace = true
log.workspace = true
rtrb.workspace = true
vst3 = "0.3"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSOpenGL", "NSMenu", "NSMenuItem"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

# Not `[lints] workspace = true`: the workspace forbids `unsafe`, which this crate needs for FFI.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
